
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Job Application Form</title>
</head>
<body>
    <h1>Job Application Form</h1>
    <p>Please complete all required fields.</p>

    <form action="#" method="post" enctype="multipart/form-data">

        <fieldset>
            <legend>Personal Information</legend>

            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" required>
            <br><br>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>
            <br><br>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone"
                   pattern="[0-9]{10}" required>
            <br><br>

            <label for="address">Address:</label>
            <textarea id="address" name="address"
                      rows="3" cols="30"></textarea>
        </fieldset>

        <br>

        <fieldset>
            <legend>Job Details</legend>

            <label for="position">Position Applied For:</label>
            <select id="position" name="position" required>
                <option value="">Select Position</option>
                <option value="Web Developer">Web Developer</option>
                <option value="Data Analyst">Data Analyst</option>
                <option value="Software Engineer">Software Engineer</option>
                <option value="AI Intern">AI Intern</option>
            </select>
            <br><br>

            <label for="experience">Years of Experience:</label>
            <input type="number" id="experience"
                   name="experience" min="0" max="50">
            <br><br>

            <label for="joining">Available Joining Date:</label>
            <input type="date" id="joining" name="joining">
        </fieldset>

        <br>

        <fieldset>
            <legend>Education</legend>

            <label for="qualification">Highest Qualification:</label>
            <select id="qualification" name="qualification" required>
                <option value="">Select Qualification</option>
                <option value="12th">12th Pass</option>
                <option value="Diploma">Diploma</option>
                <option value="Graduate">Graduate</option>
                <option value="Postgraduate">Postgraduate</option>
            </select>
            <br><br>

            <label for="skills">Skills:</label>
            <textarea id="skills" name="skills"
                      rows="3" cols="30"
                      placeholder="Enter your skills"></textarea>
        </fieldset>

        <br>

        <fieldset>
            <legend>Documents and Cover Letter</legend>

            <label for="resume">Upload Resume (PDF):</label>
            <input type="file" id="resume" name="resume"
                   accept=".pdf" required>
            <br><br>

            <label for="cover">Cover Letter:</label>
            <textarea id="cover" name="cover"
                      rows="5" cols="40"
                      placeholder="Write your cover letter"></textarea>
        </fieldset>

        <br>

        <input type="checkbox" id="declaration"
               name="declaration" required>
        <label for="declaration">
            I confirm that the information provided is correct.
        </label>
        <br><br>

        <button type="submit">Submit Application</button>
        <button type="reset">Clear Form</button>

    </form>
</body>
</html>
